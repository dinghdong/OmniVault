<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OmniVault — Project Audit Flow</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    min-height: 100vh;
    padding: 40px 20px 60px;
  }

  h1 {
    text-align: center;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: .5px;
    color: #f0f6fc;
    margin-bottom: 6px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .subtitle {
    text-align: center;
    font-size: 13px;
    color: #8b949e;
    margin-bottom: 36px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  /* ── Lane headers ── */
  .lanes {
    display: grid;
    grid-template-columns: 220px 1fr 220px;
    gap: 0;
    max-width: 980px;
    margin: 0 auto 0;
  }
  .lane-header {
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    padding: 8px 12px;
    border-radius: 6px 6px 0 0;
  }
  .lane-chain  { background: #161b22; color: #58a6ff; border: 1px solid #1f2d3d; }
  .lane-center { background: transparent; color: #8b949e; }
  .lane-ai     { background: #161b22; color: #3fb950; border: 1px solid #1a2d1a; }

  /* ── Main SVG container ── */
  .diagram-wrap {
    max-width: 980px;
    margin: 0 auto;
    background: #0d1117;
    border: 1px solid #21262d;
    border-radius: 12px;
    overflow: hidden;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
  }

  /* ── Legend ── */
  .legend {
    max-width: 980px;
    margin: 20px auto 0;
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #8b949e;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .legend-dot {
    width: 12px; height: 12px;
    border-radius: 3px;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<h1>OmniVault — Project Audit &amp; Fund Flow</h1>
<p class="subtitle">From Project Application → Multi-Agent AI Analysis → On-Chain Fulfillment</p>

  <div class="lane-header lane-center"></div>
  <div class="lane-header lane-ai">🤖 AI Service</div>
</div>

<div class="diagram-wrap">
